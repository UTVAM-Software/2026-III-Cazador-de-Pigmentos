<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión - Cazadores de Pigmentos</title>
    <style>
        body { font-family: Arial, sans-serif; background: #2c3e50; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); width: 320px; }
        .login-card h2 { margin-top: 0; color: #2c3e50; text-align: center; }
        .login-card form p { margin-bottom: 15px; }
        .login-card input[type="text"], .login-card input[type="password"] { width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        .btn-login { width: 100%; background: #27ae60; color: white; padding: 10px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold; margin-top: 10px; }
        .btn-login:hover { background: #219150; }
        .errorlist { color: red; padding-left: 20px; font-size: 0.9em; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>Iniciar Sesión</h2>
        <form method="post">
            {% csrf_token %}
            <input type="hidden" name="{{ redirect_field_name }}" value="{{ redirect_to }}">
            {{ form.as_p }}
            <button type="submit" class="btn-login">Entrar al Panel</button>
        </form>
        <div class="login-link">
            ¿aun no  tienes cuenta? <a href="{% url 'registro' %}">crear cuenta</a>
        </div>
    </div>
</body>
</html>
