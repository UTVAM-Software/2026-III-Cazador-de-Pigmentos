{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Cazadores de Pigmentos{% endblock %}</title>
    
    <!-- Tus estilos CSS globales -->
    <link rel="stylesheet" href="{% static 'usuarios/css/neobrutalim.css' %}">
    <link rel="stylesheet" href="{% static 'usuarios/adventure.css' %}">
    <link rel="stylesheet" href="{% static 'usuarios/global_background.css' %}">
    <link rel="stylesheet" href="{% static 'usuarios/app_navigation.css' %}?v=3">
    
    {% block extra_css %}{% endblock %}
</head>
<body class="global-background">
    {% include "usuarios/partials/app_navigation.html" %}
    <!-- Barra de navegación general (opcional) -->
    <header class="site-banner">
        <h2>🎨 Cazadores de Pigmentos</h2>
    </header>

    <!-- Contenido dinámico que cambiará según la página -->
    <main id="main-content">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Pie de página general (opcional) -->
    <footer class="site-footer">
        <p>&copy; 2026 - UTVAM </p>
    </footer>

    {% block extra_js %}{% endblock %}
</body>
</html>
