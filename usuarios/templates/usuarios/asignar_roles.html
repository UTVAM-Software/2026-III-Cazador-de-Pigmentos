{% extends 'usuarios/base_admin.html' %}
{% block content %}
<h2>Asignar Roles al Usuario: {{ usuario_obj.username }}</h2>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn">Actualizar Roles</button>
    <a href="{% url 'gestion_usuarios_roles' %}">Cancelar</a>
</form>
{% endblock %}
