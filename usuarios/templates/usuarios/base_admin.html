<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Administración Propia - Cazadores de Pigmentos</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f6f9; }
        nav { background: #1a252f; padding: 12px 20px; margin-bottom: 20px; border-radius: 6px; display: flex; align-items: center; justify-content: space-between; }
        .nav-links a { color: #ecf0f1; text-decoration: none; margin-right: 20px; font-weight: bold; }
        .nav-links a:hover { color: #3498db; }
        .user-info { color: white; }
        .user-info a { color: #e74c3c; text-decoration: none; margin-left: 10px; font-weight: bold; }
        .container { background: white; padding: 25px; border-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #dee2e6; padding: 10px; text-align: left; }
        th { background-color: #2c3e50; color: white; }
        .btn { background: #27ae60; color: white; padding: 8px 14px; border: none; text-decoration: none; border-radius: 4px; display: inline-block; cursor: pointer; }
        .btn-edit { background: #f39c12; color: white; }
        form div { margin-bottom: 12px; }
    </style>
</head>
<body>
    <nav>
        <div class="nav-links">
            <a href="{% url 'dashboard_admin' %}">🏠 Dashboard</a>
            <a href="{% url 'gestion_permisos' %}">1. Permisos</a>
            <a href="{% url 'gestion_roles' %}">2. Roles</a>
            <a href="{% url 'gestion_usuarios_roles' %}">3. Usuarios</a>
        </div>
        <div class="user-info">
            👤 {{ request.user.username }} | <a href="{% url 'logout' %}">Cerrar Sesión</a>
        </div>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
